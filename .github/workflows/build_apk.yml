name: Build and Release SpamZero APK
on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
    - name: Configurar Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-disabled: true
    - name: Dar permisos de ejecución a Gradlew
      run: chmod +x ./gradlew
    - name: Decodificar Keystore de Release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
    - name: Compilar APK Release Firmado
      if: startsWith(github.ref, 'refs/tags/')
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      env:
        KEYSTORE_FILE: release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: Compilar Verificación Debug
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: ./gradlew assembleDebug --no-daemon --stacktrace
    - name: Verificar o crear RELEASE_NOTES.md
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        if [ ! -f RELEASE_NOTES.md ]; then
          echo "# SpamZero ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "Novedades y mejoras en esta versión." >> RELEASE_NOTES.md
        fi
    - name: Publicar Release Oficial en GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "SpamZero ${{ github.ref_name }}"
        body_path: RELEASE_NOTES.md
        generate_release_notes: false
        files: app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
